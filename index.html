<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EzBrickz — Legal</title>
<style>
  :root {
    --bg: #1A1D23;
    --surface: #252830;
    --text: #E8ECF2;
    --text-secondary: #8B9BB4;
    --accent: #38BFFF;
    --border: #3D4458;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 440px;
    width: 100%;
    margin: 24px;
    text-align: center;
  }
  h1 { font-size: 32px; color: #fff; margin-bottom: 8px; }
  p { color: var(--text-secondary); margin-bottom: 32px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.doc {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    color: var(--accent);
    text-decoration: none;
    font-size: 17px;
    font-weight: 600;
    transition: border-color 0.15s ease;
  }
  a.doc:hover { border-color: var(--accent); }
  footer { color: var(--text-secondary); font-size: 13px; margin-top: 40px; }
</style>
</head>
<body>
  <div class="card">
    <h1>EzBrickz</h1>
    <p>Legal documents</p>
    <div class="links">
      <a class="doc" href="terms.html">Terms of Use</a>
      <a class="doc" href="privacy.html">Privacy Policy</a>
    </div>
    <footer>© 2026 EzBrickz. Not affiliated with, sponsored, or endorsed by the LEGO Group.</footer>
  </div>
</body>
</html>
